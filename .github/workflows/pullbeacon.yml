# Dogfooding: PullBeacon reviews its own PRs using the Action code from the DEFAULT branch.
# The PR head is never checked out. Live LLM calls only happen when the repository variable
# PULLBEACON_LIVE is set to 'true' (and the ANTHROPIC_API_KEY secret exists); otherwise the run
# uses mock responses and costs nothing.
name: PullBeacon (dogfood)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: pullbeacon-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@pullbeacon') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PullBeacon from the default branch (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pullbeacon-action
          persist-credentials: false
      - uses: ./.pullbeacon-action
        with:
          mode: review
          mock-llm: ${{ vars.PULLBEACON_LIVE == 'true' && 'false' || 'true' }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  apply:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pullbeacon apply') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out PullBeacon from the default branch (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pullbeacon-action
          persist-credentials: false
      - uses: ./.pullbeacon-action
        with:
          mode: apply
          mock-llm: ${{ vars.PULLBEACON_LIVE == 'true' && 'false' || 'true' }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
