name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token, no secrets, no LLM calls. Safe for pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install
        run: uv sync --locked --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --cov=pullbeacon --cov-report=term

      - name: CLI smoke (offline)
        run: |
          uv run python -m pullbeacon --help
          uv run python -m pullbeacon validate-config --file examples/.pullbeacon.yml
