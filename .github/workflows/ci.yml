name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token, no secrets, no LLM calls. Safe for pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install
        run: uv sync --locked --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --cov=pullbeacon --cov-report=term

      - name: CLI smoke (offline)
        run: |
          uv run python -m pullbeacon --help
          uv run python -m pullbeacon validate-config --file examples/.pullbeacon.yml
          uv run python -m pullbeacon review --fixture tests/fixtures/pr_auth_bug.json --mock-llm --dry-run > /dev/null
          uv run python -m pullbeacon eval --dataset evaluation/cases --mock-llm --output "$RUNNER_TEMP/mock.json" > /dev/null

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # Accepted risk (see SECURITY.md): filelock<4 is required by litellm; these 13 advisories
      # all need another local user on the same machine. Runners are ephemeral and single-tenant.
      # Any other vulnerability fails this job.
      - name: Dependency audit
        run: >-
          uv audit --locked
          --ignore GHSA-567q-5qvw-pf92
          --ignore GHSA-9vhv-jxww-xfm5
          --ignore GHSA-v4x8-3wr5-3wq8
          --ignore GHSA-6627-m3xw-93mp
          --ignore GHSA-69hj-f68j-2879
          --ignore GHSA-8mx5-7m5m-r77g
          --ignore GHSA-9c4x-gm8v-wgc4
          --ignore GHSA-9j6q-wvj5-jgjg
          --ignore GHSA-cwqr-hh33-gh44
          --ignore GHSA-fq56-3cx3-fjxp
          --ignore GHSA-j8f7-rjxc-mr56
          --ignore GHSA-m462-7rxw-wvpg
          --ignore GHSA-rfpc-qcw5-3pc4

      - name: Secret scan (gitleaks, checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

      - name: Build package
        run: |
          uv build
          ls -l dist
