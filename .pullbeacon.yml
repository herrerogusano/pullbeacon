# PullBeacon reviewing itself (dogfooding). Read from the default branch only.
version: 1
automatic_review: true
model:
  provider: anthropic
  # Chosen from docs/benchmarks/2026-10-28-claude.md: same recall as Sonnet 5.5, ~13x cheaper.
  # Live calls only happen when the repository variable PULLBEACON_LIVE is "true".
  name: anthropic/claude-haiku-5-5
limits:
  max_changed_files: 30
  max_changed_lines: 1200
  max_estimated_cost_usd: 0.50
policy:
  include: ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "action.yml"]
  exclude: ["tests/fixtures/**", "evaluation/cases/**"]
  apply_enabled: true
  allowed_apply_paths: ["src/**", "tests/**"]
